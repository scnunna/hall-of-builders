# Cross-OS end-to-end checks: every page, light and dark, on Chromium, Firefox and WebKit plus phone/tablet/tiny/wide screens.
name: e2e
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-report-${{ matrix.os }}, path: e2e-report }
